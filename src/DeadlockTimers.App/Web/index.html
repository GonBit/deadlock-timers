<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Deadlock Timers</title>
<style>
  html, body { background: transparent; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", sans-serif; color: white; font-size: 18px; }
  #clock { font-family: Consolas, monospace; font-size: 32px; font-weight: bold; }
  #status { font-size: 12px; color: gray; margin: 4px 0 6px; }
  .row { display: flex; justify-content: space-between; gap: 16px; margin: 3px 0; }
  .row .count { font-family: Consolas, monospace; }
  .warning { color: #FFA500; }
</style>
</head>
<body>
  <div id="clock">0:00</div>
  <div id="status">PAUSED</div>
  <div id="rows"></div>

  <script>
    const clock = document.getElementById("clock");
    const status = document.getElementById("status");
    const rows = document.getElementById("rows");

    async function refresh() {
      try {
        const res = await fetch("/state");
        const state = await res.json();

        clock.textContent = state.elapsed;
        status.textContent = state.running ? "" : "PAUSED";

        rows.textContent = "";
        if (state.upcoming.length === 0) {
          const row = document.createElement("div");
          row.className = "row";
          row.textContent = "No more alerts";
          rows.appendChild(row);
        }
        for (const item of state.upcoming) {
          const row = document.createElement("div");
          row.className = "row";
          if (item.warning) row.classList.add("warning");

          const label = document.createElement("span");
          label.textContent = item.label;

          const count = document.createElement("span");
          count.className = "count";
          count.textContent = item.remaining;

          row.appendChild(label);
          row.appendChild(count);
          rows.appendChild(row);
        }
      } catch (e) {
        status.textContent = "no data";
      }
    }

    setInterval(refresh, 500);
    refresh();
  </script>
</body>
</html>
